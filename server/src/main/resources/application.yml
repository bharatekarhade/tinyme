spring:
  application:
    name: tinyme-server
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 17MB
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: 300000
  config:
    # Support IntelliJ from the project root and Maven from server/.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:tinyme}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:tinyme}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:tinyme}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

tinyme:
  app-version: ${TINYME_APP_VERSION:0.1.0}
  tools:
    allow-missing-handlers: ${TINYME_ALLOW_MISSING_HANDLERS:false}

  blobs:
    path: ${TINYME_BLOBS_PATH:./blobs}

  encryption-key: ${TINYME_ENCRYPTION_KEY:}

  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}

# Only enable behind a reverse proxy you control; forwarded headers affect login IP limiting.
# server.forward-headers-strategy: native

  agent:
    name: ${TINYME_AGENT_NAME:tinyme-chat}
    tool-allow-lists:
      tinyme-chat:
        - entries_add
        - entries_query
        - entries_aggregate
        - entries_update
        - entries_delete
        - people_get
        - people_upsert
        - people_photo_add
        - plans_add
        - plans_query
        - plans_update
        - cards_list
        - cards_save
        - cards_delete
        - places_search
        - places_save
        - places_list
        - places_near
        - places_update
        - places_remove
    setup-enabled: ${TINYME_AGENT_SETUP_ENABLED:true}
    api-key: ${ANTHROPIC_API_KEY:}
    environment-id: ${ANTHROPIC_ENVIRONMENT_ID:}
    agent-id: ${ANTHROPIC_AGENT_ID:}
    memory-store-id: ${ANTHROPIC_MEMORY_STORE_ID:}
    allow-new-memory-store: ${TINYME_ALLOW_NEW_MEMORY_STORE:false}
