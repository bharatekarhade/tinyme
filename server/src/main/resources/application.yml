spring:
  application:
    name: tinyme-server
  config:
    # Support IntelliJ from the project root and Maven from server/.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:tinyme}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:tinyme}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:tinyme}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

tinyme:
  tools:
    allow-missing-handlers: ${TINYME_ALLOW_MISSING_HANDLERS:false}

  blobs:
    path: ${TINYME_BLOBS_PATH:./blobs}

# Only enable behind a reverse proxy you control; forwarded headers affect login IP limiting.
# server.forward-headers-strategy: native

  agent:
    setup-enabled: ${TINYME_AGENT_SETUP_ENABLED:true}
    api-key: ${ANTHROPIC_API_KEY:}
    environment-id: ${ANTHROPIC_ENVIRONMENT_ID:}
    agent-id: ${ANTHROPIC_AGENT_ID:}
    memory-store-id: ${ANTHROPIC_MEMORY_STORE_ID:}
    allow-new-memory-store: ${TINYME_ALLOW_NEW_MEMORY_STORE:false}
