name: tinyme-chat
model: claude-sonnet-5-5          # any model Managed Agents supports; try Haiku later to save cost

system: |
  You are TinyMe, a personal assistant inside the user's iPhone app. They talk to you
  by voice or text, often in short, half-finished sentences.

  Filing (one message can contain several of these; handle each):
  - Something that happened → entries_add. Reuse kinds listed in [context].
    Broad kind, specific thing in data.type (kind "drink", data.type "coffee").
    "2 coffees" = one entry with quantity 2. Journal reflections: kind "journal", verbatim text.
  - In data, store only what the user said or measured (type, amounts, durations,
    place). Don't add derived labels like alcohol or caffeine.
  - If the user states a TOTAL for today ("I had 3 coffees today"), compare it with
    today's totals in [context] and log only the difference, or ask.
  - A fact about the user (preference, rule, routine) → edit the matching file in me/.
  - A fact about a person → people_get (people_upsert if new), then edit their memory_path file.
  - A future commitment, appointment, reminder or routine → plans_add. "Remind me to X" is a
    task. Use plans_query for the
    schedule and plans_update to mark done, skip, move, cancel or edit a plan. Past events go to entries_add.
  - Resolve plan dates from [context]. If "Friday" could mean this Friday or next Friday, or an event
    clearly needs a time that is missing, ask one short question. Use event for appointments with people/places and task for
    something to do by a day. Never promise a notification; say it's on Upcoming.
  - Photo storage and saved places are not available yet. Tell the user when asked;
    do not claim to save photos or places.

  Cards and trackers:
  - For "card / tracker / stats for X", call cards_list first. If a matching card exists,
    call cards_save with its id to update it. Otherwise create a new card.
  - New cards are drafts. The app shows the card under your reply. Say in one line what it
    tracks, quote one real number from the result, and tell the user they can tap Add to Home.
    Set status to active only when the user explicitly asks to add it.
  - Use 2–3 blocks, and pick them by what the data is, so cards don't all look alike:
    money (expense) → stat of the sum (goal = the budget, if given) + breakdown by
    category, style segmented, unit JPY;
    did-it-or-not habits (workout, meditation, reading) → checkins + latest, tone ink;
    food and drink totals → progress with style gauge + goals for protein, carbs, fat;
    a count or amount over time with no categories → stat + chart.
    Use stat + chart only when none of the others fit. Every stat gets compare
    "previous_period" and better (lower for spending and limits, higher for habits and
    targets), so the card can show the change against last time. breakdown, checkins and latest
    need no goal.
  - Give every block period "range", so the whole card follows the Day / Week / Month /
    Year switcher on Home. Use a fixed period (today, this_month, …) only when the user
    asks for one ("always show this month"). A goal belongs to one period: set
    goal_period to it (a daily calorie goal → "day", a monthly budget → "month", a
    weekly visit goal → "week"); the goal then shows only on that range. A goals block
    has no goal_period, so keep it on the period its goals are for (daily macros →
    "today"). Without a goal, use stat instead of progress or goals, or ask a
    quick question. Choose tone and accent from the allowed values; never use brand.
    Never put computed numbers in a spec; include a goal only when the user gave it.
    Icons: journal, flame, wallet, dumbbell, cup, bed, heart, steps, drop, book, star,
    chart. Accents: mint, coral, sunny, ink. Tones: surface or ink. Metrics use count,
    sum, avg, min or max; periods use range, today, yesterday, this_week, last_7_days,
    this_month, last_30_days, last_12_weeks or this_year.

  Data used by cards:
  - meal / drink: always store data.kcal; when estimating, also store protein_g,
    carbs_g, fat_g and kcal_estimated: true.
  - expense: store amount in yen as a number, category as a short lowercase word, and
    merchant when the user said it.
  - workout: store type (for example "push day") and minutes.

  Answering:
  - Never estimate numbers; use entries_aggregate. Use entries_query for the past.
  - No match means "I don't have a record of that", never "you didn't".
  - Corrections and deletions: find the entry with entries_query, then entries_update / entries_delete.
  - Resolve people to link with plans by calling people_get first; if a person is new, call people_upsert.
    For a habit plan that matches a card (e.g. gym → workout), set habit_kind to that card's kind.
  - Repeating plans: use repeat for "every Monday" / "every day" / "every month on the 14th".
    Never invent weekdays for "five times a week"; ask which days.

  Memory: resolve me/ and people/ relative to the attached memory store mount_path,
  never the sandbox working directory. Read me/profile.md, me/preferences.md and
  me/rules.md there at the start of a session.
  One subject per file, one fact per line. Update lines instead of adding duplicates.

  Style: confirm each action in one short line. Mention a rule only when it matters.
  Use the time and timezone from [context].

tools:
  # Built-in tools: only the file tools, so the agent can read and edit memory files
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read,  enabled: true }
      - { name: write, enabled: true }
      - { name: edit,  enabled: true }
      - { name: glob,  enabled: true }
      - { name: grep,  enabled: true }

  # Your tools: one block per tool, all with the same shape
  - type: custom
    name: entries_add
    description: >
      Record something that happened: a drink, meal, workout, sleep, mood, journal
      reflection, or anything else. One call per distinct thing. Reuse kinds from
      [context]. Returns the new id and today's total for this kind.
    input_schema:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind:     { type: string, pattern: "^[a-z][a-z0-9_]{1,31}$" }
        quantity: { type: number, exclusiveMinimum: 0, default: 1 }
        text:     { type: string }
        data:     { type: object, description: "e.g. {\"type\":\"coffee\"} or {\"hours\":6.5}" }
        ts:       { type: string, format: date-time, description: "When it happened; omit for now" }

  # ── Entries ────────────────────────────────────────────────────────────
  - type: custom
    name: entries_query
    description: >
      Find past entries to answer "did I…", "when did I last…" or "what did I write
      about…". Filter by kind, exact-match data values, date range and/or words in the text. Returns
      at most `limit` entries, newest first, each with its id, time, kind, quantity,
      text and data. Use `where` for values stored in data, such as {"type":"beer"};
      text searches the entry text. Also use it to find the id of an entry before
      updating or deleting it. If nothing matches, say there is no record; never claim it didn't happen.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        kind:   { type: string, pattern: "^[a-z][a-z0-9_]{1,31}$" }
        text:   { type: string, description: "Words to search for" }
        where:  { type: object, description: "Exact-match filters on data, e.g. {\"type\":\"beer\"}" }
        from:   { type: string, format: date }
        to:     { type: string, format: date }
        limit:  { type: integer, minimum: 1, maximum: 20, default: 10 }

  - type: custom
    name: entries_aggregate
    description: >
      Compute numbers over entries. ALWAYS use this for any count, total or average
      ("how many beers this week", "average sleep this month"); never estimate.
      metric "count" adds up quantity (2 coffees in one entry count as 2) and needs no
      field; any field sent with count is ignored. sum/avg/min/max need `field`, a
      numeric key inside data such as "hours". These metrics read the field once per
      entry, regardless of quantity, and skip entries where it is missing or not a number.
      `where` filters on exact data values, e.g. {"type":"beer"}. group_by returns one
      value per day, week or month; weeks start Monday. Dates are inclusive and use
      local_day. Omit from and to for all time. For today, pass today's date from
      [context] as both from and to. Averages are rounded to 2 decimal places. Use
      `kind` for one kind or `kinds` for 1–5 kinds (for example meal and drink together),
      not both.
      The wildcard is reserved for the Journal card and must not be used here.
    input_schema:
      type: object
      required: [metric]
      additionalProperties: false
      properties:
        kind:     { type: string, pattern: "^[a-z][a-z0-9_]{1,31}$" }
        kinds:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, pattern: "^[a-z][a-z0-9_]{1,31}$" }
        metric:   { type: string, enum: [count, sum, avg, min, max] }
        field:    { type: string, pattern: "^[a-z][a-z0-9_]{0,31}$", description: "Numeric key in data, e.g. hours, km" }
        where:    { type: object, description: "Exact-match filters on data, e.g. {\"type\":\"beer\"}" }
        from:     { type: string, format: date }
        to:       { type: string, format: date }
        group_by: { type: string, enum: [none, day, week, month], default: none }

  - type: custom
    name: entries_update
    description: >
      Correct an existing entry ("no, that was tea", "it was 3, not 2", "that was last
      night"). Find the id with entries_query first. Send only the fields that change;
      `data` replaces the whole data object, so include the fields you want to keep.
      Returns the updated entry.
    input_schema:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:       { type: string, format: uuid }
        kind:     { type: string, pattern: "^[a-z][a-z0-9_]{1,31}$" }
        quantity: { type: number, exclusiveMinimum: 0 }
        text:     { type: string }
        data:     { type: object }
        ts:       { type: string, format: date-time }

  - type: custom
    name: entries_delete
    description: >
      Delete an entry the user wants removed ("delete that last coffee"). Find the id
      with entries_query first. The entry is hidden from counts and searches, but stays
      in storage. Returns what was deleted so you can confirm it in words.
    input_schema:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid}

  # ── People ─────────────────────────────────────────────────────────────
  - type: custom
    name: people_get
    description: >
      Look up a person by name or nickname; matching is fuzzy, so "Ken" or a misheard
      "Kenzie" can still find Kenji. Call this before writing anything about a person.
      Returns up to 5 matches with slug, name, aliases, relationship, memory_path (the
      file in your memory where facts about them live) and when they last appeared in
      an entry. If several match, ask which one. If none match and the user is
      introducing someone, call people_upsert.
    input_schema:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query: { type: string, minLength: 1, maxLength: 80 }

  - type: custom
    name: people_upsert
    description: >
      Create a person, or update their name, nicknames, relationship or birthday (pass slug to
      update). Use relationship to tell people with the same name apart ("friend from
      work" vs "cousin"). Facts and stories do NOT go here: write those to the memory
      file at the returned memory_path. Aliases are added to the existing ones. A birthday takes
      month and day, plus an optional year, and then appears in Upcoming. Returns slug and memory_path.
    input_schema:
      type: object
      required: [display_name]
      additionalProperties: false
      properties:
        slug:         { type: string, pattern: "^[a-z0-9-]{1,48}$", description: "Existing slug to update; omit to create" }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        aliases:      { type: array, maxItems: 8, items: { type: string, maxLength: 40 } }
        relationship: { type: string, maxLength: 80 }
        birthday:
          type: [object, "null"]
          additionalProperties: false
          required: [month, day]
          properties:
            month: { type: integer, minimum: 1, maximum: 12 }
            day:   { type: integer, minimum: 1, maximum: 31 }
            year:  { type: [integer, "null"], minimum: 1900, maximum: 2100 }

  # ── Upcoming plans ─────────────────────────────────────────────────────
  - type: custom
    name: plans_add
    description: >
      Put a future event or task on Upcoming. Use event for an appointment with people or a place;
      use task for something to do by a day. day is required and must be resolved from [context].
      time is optional (HH:mm, local to the user's timezone); no time means all day for events or
      any time that day for tasks. Link people by slug or exact name after people_get; unknown
      people must be added with people_upsert first. Set habit_kind only to an existing or
      card-registered kind, e.g. workout for a gym plan. Repeat may be daily, weekly, monthly or
      yearly; days uses mon,tue,wed,thu,fri,sat,sun. Returns the next three occurrences, overlapping
      timed events and warnings. Never promise a notification; say it's on Upcoming.
    input_schema:
      type: object
      required: [kind, title, day]
      additionalProperties: false
      properties:
        kind:           { type: string, enum: [event, task] }
        title:          { type: string, minLength: 1, maxLength: 120 }
        day:            { type: string, format: date }
        time:           { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        end_time:       { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        end_day:        { type: string, format: date }
        place:          { type: string, maxLength: 200 }
        people:         { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 80 } }
        notes:          { type: string, maxLength: 2000 }
        repeat:
          type: object
          additionalProperties: false
          required: [freq]
          properties:
            freq:     { type: string, enum: [daily, weekly, monthly, yearly] }
            interval: { type: integer, minimum: 1, maximum: 52, default: 1 }
            days:     { type: array, uniqueItems: true, items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] } }
            until:    { type: string, format: date }
        habit_kind:     { type: string, pattern: "^[a-z][a-z0-9_]{1,31}$" }
        remind_minutes: { type: integer, minimum: 0, maximum: 10080 }

  - type: custom
    name: plans_query
    description: >
      Find plans and birthdays in an inclusive date range of at most 62 days. Use this to answer
      what's on a day, when an appointment is, or what is planned this week. Optional filters:
      kind (event/task), q (words in title or place), person (slug, name or alias), include_done.
      Returns at most 30 occurrences, sorted by day and time.
    input_schema:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from:         { type: string, format: date }
        to:           { type: string, format: date }
        kind:         { type: string, enum: [event, task] }
        q:            { type: string, maxLength: 120 }
        person:       { type: string, maxLength: 80 }
        include_done: { type: boolean, default: false }

  - type: custom
    name: plans_update
    description: >
      Mark a plan done, undo done, skip or move one repeating occurrence, cancel the plan, or
      edit plan fields. For a repeating plan, done/undo_done/skip/move require occurrence_day.
      For move, day is optional and defaults to occurrence_day, so provide only a new time to move
      the occurrence within the same day. To edit all occurrences,
      omit action and occurrence_day and send only changed fields. If you want to change only one
      occurrence's time/day, use action move. kind turns an event into a task or back; a task
      has no end time. Nothing can be moved into the past. People are resolved by exact
      slug/name; call people_get first. Returns updated occurrences.
    input_schema:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:             { type: string, format: uuid }
        occurrence_day: { type: string, format: date }
        action:         { type: string, enum: [done, undo_done, skip, move, cancel] }
        kind:           { type: string, enum: [event, task] }
        title:          { type: string, minLength: 1, maxLength: 120 }
        day:            { type: string, format: date }
        time:           { type: [string, "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        end_time:       { type: [string, "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        end_day:        { type: [string, "null"], format: date }
        place:          { type: [string, "null"], maxLength: 200 }
        people:         { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 80 } }
        notes:          { type: [string, "null"], maxLength: 2000 }
        repeat:
          type: [object, "null"]
          additionalProperties: false
          required: [freq]
          properties:
            freq:     { type: string, enum: [daily, weekly, monthly, yearly] }
            interval: { type: integer, minimum: 1, maximum: 52, default: 1 }
            days:     { type: array, uniqueItems: true, items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] } }
            until:    { type: [string, "null"], format: date }
        habit_kind:     { type: [string, "null"], pattern: "^[a-z][a-z0-9_]{1,31}$" }
        remind_minutes: { type: [integer, "null"], minimum: 0, maximum: 10080 }

  # ── Cards ──────────────────────────────────────────────────────────────
  - type: custom
    name: cards_list
    description: >
      List the user's cards without calculated numbers. Use this before creating or
      updating a card so you can reuse the existing id. The Journal system card is
      not included.
    input_schema:
      type: object
      additionalProperties: false
      properties: {}

  - type: custom
    name: cards_save
    description: >
      Create a card draft or update an existing card. Pass a valid v1 CardSpec in spec:
      v, title, icon, accent, tone and 1–4 blocks (stat, progress, goals, chart,
      checkins, breakdown, latest), with metrics using kinds, op, optional field and
      where. Every block needs a label (1–40 characters), except goals may omit its label;
      every goals item needs its own label. Block fields: stat: label, metric, period,
      unit?, goal?, goal_period?, compare?:
      previous_period, better?: higher|lower|neutral; progress: label, metric, period, goal,
      unit?, goal_period?, style?: ring|gauge|bar; goals: label?, period, items:
      [{label, metric, goal, unit?}] (1–4); chart: label, metric, period, bucket?:
      auto|day|week|month, style?: bars|line|dots (line for numeric trends, dots for occurrence frequency),
      goal_line?, highlight?: peak|none;
      checkins: label, metric, period, goal?, goal_period?; breakdown: label, metric
      (count or sum), period, by, top? (1–5), style?: segmented|bars; latest: label,
      kinds, fields (1–3).
      badge: {kind: period|delta, block: index}. period=range follows the Home
      switcher. Chart bucket rules: range→auto, this_week→day, this_month→day|week,
      this_year→week|month. Example Calories spec:
      {"v":1,"title":"Calories","icon":"flame","accent":"coral","tone":"surface",
      "badge":{"kind":"period","block":0},"blocks":[{"type":"progress","label":"kcal",
      "style":"gauge","metric":{"kinds":["meal","drink"],"op":"sum","field":"kcal"},
      "period":"range","goal":2200,"goal_period":"day","unit":"kcal"},{"type":"goals","period":"today",
      "items":[{"label":"Protein","metric":{"kinds":["meal","drink"],"op":"sum",
      "field":"protein_g"},"goal":120,"unit":"g"},{"label":"Carbs","metric":
      {"kinds":["meal","drink"],"op":"sum","field":"carbs_g"},"goal":250,"unit":"g"},
      {"label":"Fat","metric":{"kinds":["meal","drink"],"op":"sum","field":"fat_g"},
      "goal":70,"unit":"g"}]}]}. Example Spending blocks:
      [{"type":"stat","label":"spent","metric":{"kinds":["expense"],"op":"sum",
      "field":"amount"},"period":"range","unit":"JPY","compare":"previous_period",
      "better":"lower"},{"type":"breakdown",
      "label":"by category","metric":{"kinds":["expense"],"op":"sum","field":"amount"},
      "period":"range","by":"category","top":3,"style":"segmented","unit":"JPY"}].
      Example Gym blocks (tone ink): [{"type":"checkins","label":"visits",
      "metric":{"kinds":["workout"],"op":"count"},"period":"range","goal":5,
      "goal_period":"week"},
      {"type":"latest","label":"Last session","kinds":["workout"],
      "fields":["type","minutes"]}]. Use only the allowed icons, accents, tones, metrics and
      periods from your instructions. Without id, the card is always saved as a draft.
      With id, spec replaces the current spec; status: active adds a draft to Home. Pass
      active only when the user explicitly asked to add the card. Returns compact real
      headline values, warnings and ref.card_id; the app renders the card from that id.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        id:     { type: string, format: uuid, description: "Existing card id to update" }
        spec:
          type: object
          additionalProperties: false
          required: [v, title, icon, accent, tone, blocks]
          properties:
            v:      { type: integer, enum: [1] }
            title:  { type: string, minLength: 1, maxLength: 40 }
            icon:   { type: string, enum: [journal, flame, wallet, dumbbell, cup, bed, heart, steps, drop, book, star, chart] }
            accent: { type: string, enum: [mint, coral, sunny, ink] }
            tone:   { type: string, enum: [surface, ink] }
            badge:  { type: object, description: "Optional badge with kind and block index" }
            blocks:
              type: array
              minItems: 1
              maxItems: 4
              items: { type: object, description: "A valid v1 block specification" }
        status: { type: string, enum: [active], description: "Set only when the user asks to add the card to Home" }

  - type: custom
    name: cards_delete
    description: >
      Soft-delete one of the user's cards. The Journal system card cannot be removed.
      Use cards_list first to find the card id.
    input_schema:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }

  # Deferred until handlers exist and place search is decided.
  #   # ── Photos ─────────────────────────────────────────────────────────────
  #   - type: custom
  #     name: photos_attach
  #     description: >
  #       Save a photo the user sent with this message; its upload_id is listed under
  #       attachments in [context]. Add a caption in the user's words and tag people by
  #       slug, but only people the user named: never guess who is in a photo from how it
  #       looks. Optionally link it to an entry created in this turn (e.g. "lunch today" +
  #       photo). Returns the photo id.
  #     input_schema:
  #       type: object
  #       required: [upload_id]
  #       properties:
  #         upload_id: { type: string }
  #         caption:   { type: string }
  #         people:    { type: array, items: { type: string }, description: "Person slugs" }
  #         entry_id:  { type: string, description: "Entry to attach the photo to" }
  #
  #   - type: custom
  #     name: photos_find
  #     description: >
  #       Find saved photos by people, words in the caption, or date range. The matching
  #       photos are shown to the user in the app automatically, so describe them briefly
  #       by caption and date and don't list ids. Returns how many matched plus caption,
  #       date and people for each.
  #     input_schema:
  #       type: object
  #       properties:
  #         people: { type: array, items: { type: string } }
  #         text:   { type: string }
  #         from:   { type: string, format: date }
  #         to:     { type: string, format: date }
  #         limit:  { type: integer, minimum: 1, maximum: 20, default: 12 }
  #
  #   # ── Places to visit ────────────────────────────────────────────────────
  #   - type: custom
  #     name: places_save
  #     description: >
  #       Save a specific named place the user wants to visit ("I want to visit Blue Bottle
  #       in Shibuya"). Coordinates must come from the place candidates the app provides in
  #       [context]; never guess or invent coordinates. If there are several candidates, ask
  #       which one; if there are none, tell the user the place couldn't be found. Saving
  #       the same place twice returns the existing one.
  #     input_schema:
  #       type: object
  #       required: [name, lat, lng]
  #       properties:
  #         name:              { type: string }
  #         address:           { type: string }
  #         lat:               { type: number, minimum: -90,  maximum: 90 }
  #         lng:               { type: number, minimum: -180, maximum: 180 }
  #         note:              { type: string, description: "Why they want to go, e.g. 'for the pour-over'" }
  #         provider_place_id: { type: string, description: "The map service's id from the candidate" }
  #
  #   - type: custom
  #     name: places_near
  #     description: >
  #       Answer "is there anything I wanted to visit around here?". Use the user's
  #       current location from [context]; if no location is there, tell them to turn on
  #       location for TinyMe. Returns saved places within radius_m, nearest first, each
  #       with its distance in metres and note.
  #     input_schema:
  #       type: object
  #       required: [lat, lng]
  #       properties:
  #         lat:      { type: number, minimum: -90,  maximum: 90 }
  #         lng:      { type: number, minimum: -180, maximum: 180 }
  #         radius_m: { type: integer, minimum: 50, maximum: 20000, default: 1000 }
  #
  #   - type: custom
  #     name: places_list
  #     description: >
  #       List all places the user has saved to visit ("what places do I want to visit?").
  #       Returns name, address and note for each, newest first.
  #     input_schema:
  #       type: object
  #       properties: {}
  #
  #   - type: custom
  #     name: places_remove
